<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102d32"><title>Connexion — Covoiturini</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="auth">
  <a class="skip-link" href="#main-content">Aller au contenu</a>
  <main class="auth-page" id="main-content">
    <a class="brand auth-brand" href="index.html" aria-label="Covoiturini - accueil"><span class="brand__mark" aria-hidden="true">C</span><span>Covoiturini</span></a>
    <div class="auth-card glass">
      <p class="eyebrow">Bon retour</p><h1>Ravi de vous <em>revoir.</em></h1>
      <p class="muted">Connectez-vous pour retrouver vos trajets.</p>
      <form data-auth-form data-auth-mode="login" novalidate>
        <label for="login-identifier">Email ou téléphone</label>
        <input id="login-identifier" required name="identifier" type="text" autocomplete="username" placeholder="vous@exemple.tn" aria-describedby="login-identifier-error">
        <p class="field-error" id="login-identifier-error" data-field-error="identifier"></p>
        <label for="login-password">Mot de passe</label>
        <input id="login-password" required name="password" type="password" autocomplete="current-password" placeholder="••••••••" aria-describedby="login-password-error">
        <p class="field-error" id="login-password-error" data-field-error="password"></p>
        <button class="button button--primary button--full" type="submit" data-submit-button>Se connecter <span aria-hidden="true">↗</span></button>
      </form>
      <p class="auth-switch">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
    </div>
    <div class="auth-art" aria-hidden="true"><div class="auth-art__circle"></div><span>🚗</span><p>Chaque trajet est<br><em>une nouvelle histoire.</em></p></div>
  </main>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><script src="js/main.js"></script>
</body>
</html>
